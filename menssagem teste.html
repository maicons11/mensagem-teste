<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uma surpresa</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #ffd6e7,
                #fff0f6
            );
        }

        .container {
            width: 90%;
            max-width: 430px;

            padding: 30px 20px;

            text-align: center;

            background: rgba(255, 255, 255, 0.88);

            border-radius: 30px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.12);
        }

        /* GIF DO URSINHO */

        .urso {
            width: 200px;
            height: 200px;

            object-fit: contain;

            margin-bottom: 10px;
        }

        h1 {
            color: #d6336c;

            font-size: 27px;

            margin: 10px 0 25px;
        }

        /* BOTÕES */

        .botoes {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 15px;

            min-height: 60px;
        }

        button {
            border: none;

            padding: 14px 28px;

            border-radius: 50px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: transform 0.2s;
        }

        #sim {
            background: #ff4d88;

            color: white;

            box-shadow:
                0 5px 15px rgba(255, 77, 136, 0.3);
        }

        #sim:hover {
            transform: scale(1.08);
        }

        #nao {
            background: #eeeeee;

            color: #555;

            position: relative;
        }

        /* TELA FINAL */

        #final {
            display: none;
        }

        #final h1 {
            font-size: 32px;
        }

        #final p {
            color: #555;

            font-size: 18px;

            line-height: 1.5;
        }

        /* CORAÇÕES */

        .coracao {
            position: fixed;

            bottom: -40px;

            font-size: 25px;

            pointer-events: none;

            animation:
                subir 4s linear forwards;
        }

        @keyframes subir {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }

    </style>

</head>


<body>


    <!-- PRIMEIRA TELA -->

    <div class="container" id="principal">


        <!--
            GIF INICIAL

            Arquivo:
            imagens/ursinho.gif
        -->
        <img src="c:\Maicon TI\Módulo 1 (TI)\download\ursinho1.gif"
        <img
            id="ursoInicial"
            class="urso"
            src="imagem/ursinho.gif"
            alt="Ursinho"
        >


        <h1>
            Você aceita participar dessa experiência? 👀
        </h1>


        <div class="botoes">

            <button id="sim">
                SIM ❤️
            </button>

            <button id="nao">
                NÃO 😭
            </button>

        </div>

    </div>



    <!-- SEGUNDA TELA -->

    <div class="container" id="final">


        <!--
            GIF DEPOIS DO SIM

            Arquivo:
            s
        -->
        <img src="c:\Maicon TI\Módulo 1 (TI)\download\ursinho2.gif"

        <img
            id="ursoFinal"
            class="urso"
            src="imagem/ursinho-sim.gif"
            alt="Ursinho feliz"
        >


        <h1>
            EU SABIA! 😂🎉
        </h1>


        <p>
            Deu certo! Você desbloqueou a próxima etapa 😎
        </p>

    </div>



    <script>


        /* BOTÕES */

        const botaoSim =
            document.getElementById("sim");

        const botaoNao =
            document.getElementById("nao");


        let tamanhoSim = 1;



        /*
            FAZER O BOTÃO NÃO FUGIR
        */

        function fugir() {

            const largura =
                window.innerWidth;

            const altura =
                window.innerHeight;


            const x =
                Math.random() *
                (largura - 120);


            const y =
                Math.random() *
                (altura - 70);


            botaoNao.style.position =
                "fixed";


            botaoNao.style.left =
                x + "px";


            botaoNao.style.top =
                y + "px";


            tamanhoSim += 0.08;


            botaoSim.style.transform =
                `scale(${tamanhoSim})`;

        }



        /*
            COMPUTADOR
        */

        botaoNao.addEventListener(
            "mouseover",
            fugir
        );



        /*
            CELULAR
        */

        botaoNao.addEventListener(
            "touchstart",
            function(event) {

                event.preventDefault();

                fugir();

            }
        );



        /*
            QUANDO CLICAR EM SIM
        */

        botaoSim.addEventListener(
            "click",
            function() {


                /* Esconde primeira tela */

                document.getElementById(
                    "principal"
                ).style.display = "none";


                /* Mostra segunda tela */

                document.getElementById(
                    "final"
                ).style.display = "block";


                /* Solta os corações */

                criarCoracoes();

            }
        );



        /*
            CRIAR CORAÇÕES
        */

        function criarCoracoes() {


            const tipos = [
                "❤️",
                "💕",
                "💖",
                "💗",
                "💓"
            ];


            for (
                let i = 0;
                i < 40;
                i++
            ) {


                setTimeout(
                    function() {


                        const coracao =
                            document.createElement(
                                "div"
                            );


                        coracao.className =
                            "coracao";


                        coracao.innerHTML =
                            tipos[
                                Math.floor(
                                    Math.random() *
                                    tipos.length
                                )
                            ];


                        coracao.style.left =
                            Math.random() *
                            100 +
                            "vw";


                        coracao.style.animationDuration =
                            3 +
                            Math.random() *
                            3 +
                            "s";


                        document.body.appendChild(
                            coracao
                        );


                        setTimeout(
                            function() {

                                coracao.remove();

                            },
                            6000
                        );


                    },
                    i * 100
                );

            }

        }

    </script>

</body>

</html>
